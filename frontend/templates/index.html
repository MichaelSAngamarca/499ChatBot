<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkAssist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!--Navigation Bar-->
    <div class="navbar">
        <label for="toolsMenu">Tools:</label>
        <select id="toolsMenu" onchange="navigatePage()">
            <option value="/">Home</option>
            <option value="/reminders">Reminders</option>
        </select>

        <!-- STATUS BADGE -->
        <div id="statusBadge" aria-live="polite" title="Connectivity status">Checking…</div>
    </div>
    
    <!--Main Chat Area-->
    <div class="chat-container" id="chatContainer">
        <div class="intro-message" id="botMessage">Ask me anything...</div>
    </div>

    <!--Mic Button-->
    <button id="micButton" class="mic-btn large">
        🎤
    </button>

    <script src="{{  url_for('static', filename='script.js') }}"></script>
</body>
</html>
