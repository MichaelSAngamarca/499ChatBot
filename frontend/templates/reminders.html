<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkAssist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!--Navigation Bar-->
    <div class="navbar">
        <label for="toolsMenu">Tools:</label>
        <select id="toolsMenu" onchange="navigatePage()">
            <option value="/">Home</option>
            <option value="/reminders">Reminders</option>
        </select>

        <!-- STATUS BADGE -->
        <div id="statusBadge" aria-live="polite" title="Connectivity status">Checking…</div>
    </div>

    <!--Reminderss Area-->
    <div class="reminder-container">
        <h1>Reminders</h1>

        <form id="reminderForm">
            <input type="text" id="reminderText" placeholder="Enter reminder..." required>
            <select id="priority">
                <option value="low">🟢 Low</option>
                <option value="medium">🟡 Medium</option>
                <option value="high">🔴 High</option>
            </select>
            <button type="button" id="addReminderBtn">Add</button>
        </form>

        <ul id="reminderList"></ul>
    </div>

    <script src="{{  url_for('static', filename='script.js') }}"></script>
</body>
</html>
